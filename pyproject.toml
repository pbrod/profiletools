[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profiletools"
version = "0.1.0"
description = "Lightweight decorators and context managers for profiling Python code."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Per", email = "you@example.com" }
]
keywords = ["profiling", "performance", "line_profiler", "cProfile", "timing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: BSD License",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]

dependencies = []

[project.optional-dependencies]
line = ["line_profiler>=4.0"]

[project.urls]
Homepage = "https://github.com/pbrod/profiletools"
Source = "https://github.com/pbrod/profiletools"
Issues = "https://github.com/pbrod/profiletools/issues"

[tool.setuptools.packages.find]
where = ["src"]
