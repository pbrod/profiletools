# ---------------------------------------------------------------------------
# Release Workflow (profiletools)
#
# Development:
#   git checkout develop
#   git pull origin develop
#   ruff format
#   ruff check
#   mypy src/
#   pytest tests
#
# Prepare release:
#   # Update README, LICENSE, and CHANGELOG. Inspect and verify.
#   git log vX.Y.(Z-1)..HEAD --oneline > log.txt
#   git add .
#   git commit
#   git push
#
# Version bump:
#   # Update version number X.Y.Z in this file (pyproject.toml).
#
# Release:
#   git checkout master
#   git pull origin master
#   git merge --no-ff develop
#   git push origin master        # Wait for CI to complete successfully
#
# Tag and publish:
#   # Create a git tag vX.Y.Z that matches the version number in pyproject.toml
#   git push --tags               # Triggers GitHub Actions release workflow
#
# Notes:
#   - Publishing to PyPI occurs automatically when a tag beginning with 'v'
#     is pushed and the GitHub release workflow succeeds.
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profiletools"
version = "0.2.0"
description = "Lightweight decorators and context managers for profiling Python code."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Per A. Brodtkorb", email = "per.andreas.brodtkorb@gmail.com" }
]
keywords = ["profiling", "performance", "line_profiler", "cProfile", "timing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]

dependencies = []

[project.optional-dependencies]
line = ["line_profiler>=4.0"]

[project.urls]
Homepage = "https://github.com/pbrod/profiletools"
Source = "https://github.com/pbrod/profiletools"
Issues = "https://github.com/pbrod/profiletools/issues"

[tool.setuptools.packages.find]
where = ["src"]
