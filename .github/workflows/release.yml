name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # REQUIRED for Trusted Publishing

    environment:
      name: pypi
      url: https://pypi.org/p/profiletools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build check-wheel-contents

      - name: Extract version from tag
        id: version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version already exists on PyPI
        id: check_version
        run: |
          PACKAGE_NAME=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["name"])
          PY
          )

          VERSION="${{ steps.version.outputs.version }}"
          PYPI_URL="https://pypi.org/pypi/$PACKAGE_NAME/$VERSION/json"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PYPI_URL")

          if [ "$STATUS" -eq 200 ]; then
            echo "version_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION already exists on PyPI — skipping publish."
          else
            echo "version_exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION not found — will publish."
          fi

      - name: Build package
        if: steps.check_version.outputs.version_exists == 'false'
        run: python -m build

      - name: Validate wheel contents
        if: steps.check_version.outputs.version_exists == 'false'
        run: check-wheel-contents dist/*.whl

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.check_version.outputs.version_exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
        #  publish: true
